# Save as /etc/nginx/sites-available/fursad
# Replace yourdomain.com with the real domain before enabling.
#
# This is the pre-SSL version — run `sudo certbot --nginx -d yourdomain.com
# -d www.yourdomain.com` after this is live, and Certbot will edit this file
# in place to add the HTTPS server block and the HTTP->HTTPS redirect. Don't
# hand-write the SSL block yourself; let Certbot do it so the cert paths are
# always correct.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Serves the Vite production build directly.
    root /var/www/fursad/fursad/frontend/dist;
    index index.html;

    client_max_body_size 10M;   # CVs up to 8MB, avatars up to 2MB + headroom

    # React Router client-side routes: anything not a real file falls back
    # to index.html so /dashboard/jobs etc. don't 404 on a hard refresh.
    location / {
        try_files $uri /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — the Upgrade/Connection headers are what let this stay a
    # real WebSocket instead of silently falling back to polling (or failing
    # outright). This is the block most VPS Socket.IO deploys get wrong.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # keep long-lived socket connections open
    }

    # Publicly-served avatars/logos (CVs are never served this way — they go
    # through an authorised download route, not a static path).
    location /uploads/avatars/ {
        proxy_pass http://127.0.0.1:5000/uploads/avatars/;
        proxy_set_header Host $host;
    }
}
