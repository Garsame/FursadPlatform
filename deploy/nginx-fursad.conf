# Fursad — Nginx site config
#
#   sudo cp deploy/nginx-fursad.conf /etc/nginx/sites-available/fursad
#   sudo nano /etc/nginx/sites-available/fursad     # replace yourdomain.com
#   sudo ln -sf /etc/nginx/sites-available/fursad /etc/nginx/sites-enabled/fursad
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the PRE-TLS version. Run Certbot afterwards:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# It edits this file in place to add the HTTPS server block and the redirect.
# Let it. Hand-writing the TLS block is how cert paths end up wrong.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # The Vite production build. Nginx serves these straight from disk —
    # Node never touches the frontend.
    root /var/www/fursad/fursad/frontend/dist;
    index index.html;

    # CVs are capped at 8MB and avatars at 2MB in the app; this leaves headroom
    # for the multipart envelope. Too low here and uploads fail at the proxy
    # with a 413 before the app ever sees them.
    client_max_body_size 12M;

    access_log /var/log/nginx/fursad.access.log;
    error_log  /var/log/nginx/fursad.error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed bundle filenames change whenever content changes, so they can be
    # cached hard and forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router owns the client-side routes. Anything that is not a real
    # file falls through to index.html, so /dashboard/jobs survives a hard
    # refresh instead of 404ing.
    location / {
        try_files $uri /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI calls (CV parsing, shortlisting) are slow
    }

    # Socket.IO — real-time chat.
    #
    # The Upgrade and Connection headers are what turn this into a real
    # WebSocket. Without them the handshake silently degrades to long-polling
    # or fails outright, and the symptom is messages that only appear after a
    # page refresh. This is the single most commonly mis-configured block in a
    # VPS Socket.IO deployment.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # keep idle sockets open rather than culling them
    }

    # Avatars and company logos are public by design and served by Express.
    # CVs deliberately are NOT here — they go through an authorised route under
    # /api/cvs/:id/download that checks the requester is entitled to that record.
    location /uploads/avatars/ {
        proxy_pass http://127.0.0.1:5000/uploads/avatars/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Nothing else should reach the uploads tree from outside.
    location /uploads/ {
        return 404;
    }
}
